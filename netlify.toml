# Prepared for Netlify. Nothing here has been connected or deployed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Indexing stays OFF until the domain krystalclearny.com points to this site
# (the old WordPress site is still live there). On launch day: set this to "true",
# check the 301s in public/_redirects live, then submit the sitemap in Search Console.
# Previews and branch deploys always get noindex + Disallow.
[context.production.environment]
  SITE_INDEXABLE = "false"
[context.deploy-preview.environment]
  SITE_INDEXABLE = "false"
[context.branch-deploy.environment]
  SITE_INDEXABLE = "false"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
